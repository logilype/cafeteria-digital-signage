<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cafeteria Angebote</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Open Sans', sans-serif;
            font-size: 150%;
            background-color: #f5f6fa; /* Light gray background */
            color: #333;
            text-align: center;
        }

        .container-table {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .offers-container {
            width: 80%;
            background-color: #fff; /* Keep container white */
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .offer-content {
            text-align: center;
            opacity: 1;
            transition: opacity 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #offerImage {
            max-width: 100%;
            height: 450px;
            object-fit: contain;
            border-radius: 20px;
            display: block;
            margin: 0 auto; /* Center horizontally */
        }

        .image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 225%;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        #offerName {
            font-size: 180%;
            margin: 20px 0;
            color: #2c3e50;
        }

        #offerPrice {
            font-size: 160%;
            color: #27ae60;
            margin: 15px 0;
            font-weight: bold;
        }

        #offerDays {
            font-size: 140%;
            color: #3498db;
        }

        @font-face {
            font-family: 'Open Sans';
            src: url('/dashboard/fonts/OpenSans-Regular.woff2') format('woff2'),
                 url('/dashboard/fonts/OpenSans-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        /* Update fullscreen buttons */
        #enterFullscreenBtn {
            background: rgba(39, 174, 96, 0.9) !important;
        }

        #exitFullscreenBtn {
            background: rgba(231, 76, 60, 0.9) !important;
        }

        #enterFullscreenBtn:hover {
            background: rgba(39, 174, 96, 1) !important;
        }

        #exitFullscreenBtn:hover {
            background: rgba(231, 76, 60, 1) !important;
        }
    </style>
</head>
<body>
    <div id="fullscreenPrompt" style="
        display: none;
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1000;">
        <button id="enterFullscreenBtn" onclick="enterFullscreen()" style="
            padding: 10px 20px;
            background: rgba(39, 174, 96, 0.9);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;">
            Vollbildmodus aktivieren
        </button>
        <button id="exitFullscreenBtn" onclick="exitFullscreen()" style="
            display: none;
            padding: 10px 20px;
            background: rgba(231, 76, 60, 0.9);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;">
            Vollbildmodus beenden
        </button>
    </div>
    <div class="container-table">
        <div class="offers-container">
            <h2>Angebote</h2>
            <div class="offer-content" id="offerContent">
                <div class="image-container">
                    <img id="offerImage" src="" alt="Angebotsbild" onerror="this.style.display='none'">
                </div>
                <p id="offerName"></p>
                <p id="offerPrice"></p>
                <p id="offerDays"></p>
            </div>
        </div>
    </div>

    <script>
        var offers = []; // Will be replaced by server
        var currentOfferIndex = 0;
        var offerContent = document.getElementById("offerContent");
        var offerImage = document.getElementById("offerImage");
        var offerName = document.getElementById("offerName");
        var offerPrice = document.getElementById("offerPrice");
        var offerDays = document.getElementById("offerDays");

        function fadeIn(element) {
            element.style.opacity = 0;
            element.style.transition = 'opacity 0s';
            requestAnimationFrame(function() {
                element.style.transition = 'opacity 0.5s';
                element.style.opacity = 1;
            });
        }

        function updateOffer() {
            if (offers.length === 0) return;
            
            offerContent.style.opacity = 0;

            setTimeout(function() {
                var offer = offers[currentOfferIndex];
                console.log('Loading image:', offer.image);
                offerImage.src = offer.image.startsWith('/') ? offer.image : '/media/' + offer.image;
                offerImage.onerror = function() {
                    console.error('Failed to load image:', offer.image);
                    this.style.display = 'none';
                };
                offerImage.onload = function() {
                    this.style.display = 'block';
                };
                offerName.textContent = offer.name;
                offerPrice.innerHTML = offer.price.toFixed(2).replace('.', ',') + '&nbsp;€';
                offerDays.textContent = "Im Angebot: " + offer.days;
                fadeIn(offerContent);
                currentOfferIndex = (currentOfferIndex + 1) % offers.length;
            }, 500);
        }

        // Add settings fetch at the start
        async function fetchSettings() {
            try {
                const response = await fetch('/api/settings');
                const settings = await response.json();
                return {
                    transitionTime: (settings.transitionTime || 5) * 1000,
                    displayTime: (settings.displayTime || 5) * 1000
                };
            } catch (error) {
                console.error('Error fetching settings:', error);
                return { transitionTime: 5000, displayTime: 5000 };
            }
        }

        // Update the initialization
        async function initializeOffers() {
            const settings = await fetchSettings();
            
            if (!offers || offers.length === 0) {
                document.getElementById('offerContent').innerHTML = '<p>Keine Angebote verfügbar.</p>';
            } else {
                // Initial update
                updateOffer();

                // Update based on settings
                setInterval(updateOffer, settings.displayTime + settings.transitionTime);

                // Update transition duration in CSS
                document.documentElement.style.setProperty('--transition-duration', `${settings.transitionTime/1000}s`);
            }
        }

        // Call initialize instead of direct setup
        initializeOffers();

        // Update the fullscreen functions
        function enterFullscreen() {
            document.documentElement.requestFullscreen().then(() => {
                document.getElementById('enterFullscreenBtn').style.display = 'none';
                document.getElementById('exitFullscreenBtn').style.display = 'block';
            }).catch(err => {
                console.log('Error attempting to enable fullscreen:', err);
            });
        }

        function exitFullscreen() {
            document.exitFullscreen().then(() => {
                document.getElementById('enterFullscreenBtn').style.display = 'block';
                document.getElementById('exitFullscreenBtn').style.display = 'none';
            }).catch(err => {
                console.log('Error attempting to exit fullscreen:', err);
            });
        }

        // Update fullscreen change handler
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                document.getElementById('enterFullscreenBtn').style.display = 'none';
                document.getElementById('exitFullscreenBtn').style.display = 'block';
            } else {
                document.getElementById('enterFullscreenBtn').style.display = 'block';
                document.getElementById('exitFullscreenBtn').style.display = 'none';
            }
        });

        // Show initial button if URL has #fullscreen
        if (window.location.hash === '#fullscreen') {
            document.getElementById('fullscreenPrompt').style.display = 'block';
            document.getElementById('enterFullscreenBtn').style.display = 'block';
            document.getElementById('exitFullscreenBtn').style.display = 'none';
        }
    </script>
</body>
</html>
