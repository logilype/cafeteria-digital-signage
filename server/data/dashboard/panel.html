<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CafDS Dashboard</title>
    <link rel="stylesheet" href="/dashboard/styles.css">
    <link rel="icon" type="image/x-icon" href="/dashboard/assets/favicon.ico">
    <script src="/dashboard/js/navbar.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="/dashboard/assets/logo.png" alt="CafDS Logo" class="header-logo">
            <span class="header-title">CafDS Dashboard</span>
        </div>
        <div class="header-buttons">
            <button id="logoutBtn">Ausloggen</button>
        </div>
    </div>
    <div class="navbar" id="navbar"></div>

    <div class="content">
        <h1>Willkommen im CafDS Dashboard</h1>
        <div class="dashboard-stats">
            <div class="stat-card">
                <h3>Aktive Geräte</h3>
                <div class="stat-value" id="activeDevices">-</div>
            </div>
            <div class="stat-card">
                <h3>Playlists</h3>
                <div class="stat-value" id="playlistCount">-</div>
            </div>
            <div class="stat-card">
                <h3>Aktive Angebote</h3>
                <div class="stat-value" id="activeOffers">-</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initializeNavbar('home');
            
            // Logout handler
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                try {
                    const response = await fetch('/api/auth/logout', { method: 'POST' });
                    if (response.ok) {
                        window.location.href = '/ui/login';
                    }
                } catch (error) {
                    console.error('Logout failed:', error);
                }
            });

            // Load dashboard stats
            loadStats();
        });

        async function loadStats() {
            try {
                const [devices, playlists, offers] = await Promise.all([
                    fetch('/api/devices').then(r => r.json()),
                    fetch('/api/playlists').then(r => r.json()),
                    fetch('/api/getoffers').then(r => r.json())
                ]);

                document.getElementById('activeDevices').textContent = 
                    devices.filter(d => d.online).length;
                document.getElementById('playlistCount').textContent = 
                    playlists.length;
                document.getElementById('activeOffers').textContent = 
                    offers.filter(o => o.visibility).length;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
    </script>
</body>
</html>
