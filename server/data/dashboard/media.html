<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="/dashboard/assets/favicon.ico">
    <title>CafDS Dashboard - Medien verwalten</title>
    <link rel="stylesheet" href="/dashboard/styles.css">
    <script src="/dashboard/js/navbar.js"></script>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <img src="/dashboard/assets/logo.png" alt="CafDS Logo" class="header-logo">
            <span class="header-title">CafDS Dashboard</span>
        </div>
        <div class="header-buttons">
            <button onclick="document.getElementById('uploadInput').click()" class="action-btn">Neue Datei</button>
            <button onclick="refreshMedia()" class="action-btn">Aktualisieren</button>
            <div class="header-separator"></div>
            <button id="logoutBtn">Ausloggen</button>
        </div>
    </div>
    <div class="navbar" id="navbar"></div>
    <div class="content">
        <div class="tables-media">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Vorschau</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    (renderanchor)
                </tbody>
            </table>
        </div>
    </div>
    <div class="footer">
        <a href="https://github.com/logilype/cafeteria-digital-signage" style="color: white; text-decoration: none;">© Logilype & Felixmax_ 2025</a>
    </div>
    <script>
        document.getElementById("logoutBtn").addEventListener("click", function() {
            document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = "/ui/login";
        });

        function deleteImage(imageName) {
            if (confirm("Möchten Sie dieses Bild wirklich löschen?")) {
                fetch(`/api/deleteimage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name: imageName }),
                })
                .then(response => {
                    if (response.ok) {
                        window.location.reload();
                    } else {
                        alert("Fehler beim Löschen des Bildes.");
                    }
                });
            }
        }

        document.querySelector("#newbtn").addEventListener("click", function(){
            window.location.href = "/panel/upload";
        });
        document.querySelector("#uploadimgbtn").addEventListener("click", function(){
            window.location.href = "/panel/media";
        });
        document.querySelector("#refreshbtn").addEventListener("click", function(){
            
            window.location.href = "/panel?intent=refresh";
        });
        document.getElementById("logoutBtn").addEventListener("click", function() {
            // Clear the token cookie
            document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            // Redirect to the login page
            window.location.href = "/ui/login";
        });

        document.addEventListener('DOMContentLoaded', function() {
            initializeNavbar('media');
            // existing initialization code
        });
    </script>
</body>
</html>
