<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CafDS Dashboard - Werbung bearbeiten</title>
    <link rel="stylesheet" href="/dashboard/styles.css">
    <link rel="icon" type="image/x-icon" href="/dashboard/assets/favicon.ico">
    <script src="/dashboard/js/navbar.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <img src="/dashboard/assets/logo.png" alt="CafDS Logo" class="header-logo">
            <span class="header-title">CafDS Dashboard</span>
        </div>
        <div class="header-buttons">
            <button onclick="openCreateModal()" class="action-btn">Neue Werbung</button>
            <button onclick="fetchAds()" class="action-btn">Aktualisieren</button>
            <div class="header-separator"></div>
            <button id="logoutBtn">Ausloggen</button>
        </div>
    </div>
    <div class="navbar" id="navbar"></div>

    <div class="content">
        <div class="tables">
            <div class="grid-container">
                <!-- Ads will be rendered here -->
            </div>
        </div>
        
        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <div class="modal-header edit">
                    <h2>Werbung bearbeiten</h2>
                    <span class="close">&times;</span>
                </div>
                <form id="editForm">
                    <input type="hidden" id="editId">
                    
                    <div class="form-group">
                        <label for="editHeader">Überschrift:</label>
                        <input type="text" id="editHeader" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Bild:</label>
                        <div class="selected-image">
                            <img id="editPreviewImage" src="" alt="">
                        </div>
                        <button type="button" class="image-select-btn" onclick="toggleDropdown('edit')">Bild auswählen</button>
                        <div id="editImageDropdownList" class="dropdown-list" style="display: none;"></div>
                        <input type="hidden" id="editImage">
                    </div>
                    
                    <div class="form-group">
                        <label for="editDescription">Beschreibung:</label>
                        <textarea id="editDescription" required></textarea>
                    </div>
                    
                    <div class="form-group toggle-group">
                        <span class="toggleVisibilityTxt">Wird nicht angezeigt</span>
                        <label class="toggle">
                            <input type="checkbox" id="toggleVisibilityBtn">
                            <span class="slider round"></span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <p id="saveMessage" style="display: none;">Änderungen werden gespeichert...</p>
                        <button type="submit">Speichern</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Create Modal -->
        <div id="createModal" class="modal">
            <div class="modal-content">
                <div class="modal-header create">
                    <h2>Neue Werbung</h2>
                    <span class="close">&times;</span>
                </div>
                <form id="createForm">
                    <div class="form-group">
                        <label for="createHeader">Überschrift:</label>
                        <input type="text" id="createHeader" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Bild:</label>
                        <div class="selected-image">
                            <img id="createPreviewImage" src="" alt="">
                        </div>
                        <button type="button" class="image-select-btn" onclick="toggleDropdown('create')">Bild auswählen</button>
                        <div id="createImageDropdownList" class="dropdown-list" style="display: none;"></div>
                        <input type="hidden" id="createImage">
                    </div>
                    
                    <div class="form-group">
                        <label for="createDescription">Beschreibung:</label>
                        <textarea id="createDescription" required></textarea>
                    </div>
                    
                    <div class="form-group toggle-group">
                        <span class="toggleVisibilityTxt">Wird nicht angezeigt</span>
                        <label class="toggle">
                            <input type="checkbox" id="toggleVisibilityBtn">
                            <span class="slider round"></span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <p id="saveMessage" style="display: none;">Änderungen werden gespeichert...</p>
                        <button type="submit">Speichern</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="footer">
        <a href="https://github.com/logilype/cafeteria-digital-signage" style="color: white; text-decoration: none;">
            © Logilype & Felixmax_ 2025
        </a>
    </div>

    <!-- Add this right after the opening body tag -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            initializeNavbar('advertising');
            fetchAds();
            setupModalHandlers();
        });

        async function fetchAds() {
            try {
                const response = await fetch('/api/advertisements');
                const ads = await response.json();
                
                const gridContainer = document.querySelector('.grid-container');
                gridContainer.innerHTML = ads.map(ad => `
                    <article class="grid-item">
                        <div class="grid-item-content">
                            <header>
                                <div class="image-container">
                                    <img src="${ad.image}" alt="${ad.header}">
                                </div>
                                <h3 class="item-name">${ad.header}</h3>
                            </header>
                            <div class="item-details">
                                <div class="description-container">
                                    <p class="item-description">${ad.description}</p>
                                </div>
                                <p class="item-visibility ${ad.enabled ? '' : 'inactive'}">
                                    ${ad.enabled ? 'Wird angezeigt' : 'Wird nicht angezeigt'}
                                </p>
                            </div>
                            <footer class="buttons">
                                <button onclick='openEditModal(${JSON.stringify(ad)})'>Bearbeiten</button>
                                <button onclick="deleteAd('${ad.id}')">Löschen</button>
                            </footer>
                        </div>
                    </article>
                `).join('');
            } catch (error) {
                console.error('Error fetching advertisements:', error);
            }
        }

        // Add toast notification function
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            
            const container = document.getElementById('toastContainer');
            container.appendChild(toast);

            // Remove toast after 3 seconds
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-out';
                setTimeout(() => {
                    container.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // Update modal handling
        function showModal(modal) {
            modal.style.display = 'block';
            // Trigger reflow
            modal.offsetHeight;
            modal.classList.add('show');
        }

        function hideModal(modal) {
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        // Update existing functions to use new toast and modal handling
        async function handleFormSubmit(e) {
            e.preventDefault();
            document.getElementById('saveMessage').style.display = 'block';

            const formData = {
                id: document.getElementById("editId").value,
                header: document.getElementById("editHeader").value,
                image: document.getElementById("editImage").value,
                description: document.getElementById("editDescription").value,
                enabled: document.getElementById("toggleVisibilityBtn").checked
            };

            try {
                const response = await fetch('/api/advertisement', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    hideModal(document.getElementById("editModal"));
                    showToast('Werbung erfolgreich gespeichert');
                    fetchAds();
                } else {
                    throw new Error('Failed to save');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Fehler beim Speichern der Werbung.', 'error');
            }
        }

        async function deleteAd(id) {
            if (!confirm('Möchten Sie diese Werbung wirklich löschen?')) return;
            
            try {
                const response = await fetch('/api/advertisement/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                
                if (response.ok) {
                    showToast('Werbung erfolgreich gelöscht');
                    fetchAds();
                } else {
                    throw new Error('Failed to delete');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Fehler beim Löschen der Werbung.', 'error');
            }
        }

        function openEditModal(ad) {
            document.getElementById("editId").value = ad.id;
            document.getElementById("editHeader").value = ad.header;
            document.getElementById("editDescription").value = ad.description;
            document.getElementById("editImage").value = ad.image;
            document.getElementById("editPreviewImage").src = ad.image;
            document.getElementById("toggleVisibilityBtn").checked = ad.enabled;
            document.querySelector(".toggleVisibilityTxt").textContent = 
                ad.enabled ? "Wird angezeigt" : "Wird nicht angezeigt";
            
            showModal(document.getElementById("editModal"));
        }

        function setupModalHandlers() {
            const editModal = document.getElementById("editModal");
            const createModal = document.getElementById("createModal");
            const closeBtns = document.querySelectorAll(".close");
            
            // Handle all close buttons
            closeBtns.forEach(btn => {
                btn.onclick = () => {
                    hideModal(editModal);
                    hideModal(createModal);
                };
            });

            // Close on outside click
            window.onclick = (e) => {
                if (e.target === editModal) hideModal(editModal);
                if (e.target === createModal) hideModal(createModal);
            };

            // Add escape key handler
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    hideModal(editModal);
                    hideModal(createModal);
                }
            });

            document.getElementById("toggleVisibilityBtn").addEventListener("change", function() {
                const text = document.querySelector(".toggleVisibilityTxt");
                text.textContent = this.checked ? "Wird angezeigt" : "Wird nicht angezeigt";
            });

            document.getElementById("editForm").addEventListener("submit", handleFormSubmit);
        }

        function toggleDropdown(modalType) {
            const dropdownList = document.getElementById(modalType === 'create' ? "createImageDropdownList" : "editImageDropdownList");
            if (dropdownList.style.display === "none") {
                fetch('/api/getImages')
                    .then(response => response.json())
                    .then(images => {
                        dropdownList.innerHTML = images.map(image => `
                            <div onclick="selectImage('${image}', '${modalType}')">
                                <img src="${image}" alt="${image.split('/').pop()}">
                            </div>
                        `).join('');
                        dropdownList.style.display = "block";
                    })
                    .catch(error => console.error('Error loading images:', error));
            } else {
                dropdownList.style.display = "none";
            }
        }

        function selectImage(image, modalType) {
            const prefix = modalType === 'create' ? 'create' : 'edit';
            document.getElementById(`${prefix}Image`).value = image;
            document.getElementById(`${prefix}PreviewImage`).src = image;
            document.getElementById(`${prefix}ImageDropdownList`).style.display = "none";
        }

        document.getElementById("logoutBtn").addEventListener("click", function() {
            document.cookie = "token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = "/ui/login";
        });

        function openCreateModal() {
            // Clear form fields
            document.getElementById("createHeader").value = "";
            document.getElementById("createImage").value = "";
            document.getElementById("createDescription").value = "";
            document.getElementById("toggleVisibilityBtn").checked = false;
            
            // Show the create modal
            showModal(document.getElementById("createModal"));
        }

        // Add create form submit handler
        document.getElementById("createForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const saveMessage = document.getElementById('saveMessage');
            saveMessage.style.display = 'block';

            const formData = {
                header: document.getElementById("createHeader").value,
                image: document.getElementById("createImage").value,
                description: document.getElementById("createDescription").value,
                enabled: document.getElementById("toggleVisibilityBtn").checked
            };

            try {
                const response = await fetch('/api/advertisement', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    hideModal(document.getElementById("createModal"));
                    showToast('Werbung erfolgreich erstellt');
                    fetchAds(); // Refresh the grid
                } else {
                    throw new Error('Failed to create');
                }
            } catch (error) {
                console.error('Error:', error);
                showToast('Fehler beim Erstellen der Werbung.', 'error');
            } finally {
                saveMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
